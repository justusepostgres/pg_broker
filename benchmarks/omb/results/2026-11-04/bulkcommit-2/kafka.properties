# Diagnostic single-node KRaft baseline, Kafka 3.6.1. Private loopback only.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:19093
listeners=PLAINTEXT://10.84.0.247:19092,CONTROLLER://127.0.0.1:19093
advertised.listeners=PLAINTEXT://10.84.0.247:19092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
log.dirs=/home/ubuntu/omb-pair-017-bulkcommit-2-kafka-data
num.partitions=16
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
# Make local disk-flush policy explicit; not Kafka's default durability policy.
log.flush.interval.messages=9223372036854775807
log.retention.hours=24
