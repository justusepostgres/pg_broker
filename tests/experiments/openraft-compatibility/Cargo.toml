[package]
name = "openraft-format-probe"
version = "0.0.0"
edition = "2021"
[workspace]
[dependencies]
openraft_old = { package = "openraft", version = "=0.9.25", features = ["serde", "storage-v2"] }
openraft_next = { package = "openraft", version = "=0.10.0-alpha.37", features = ["serde", "type-alias"] }
serde_json = "=1.0.154"
serde = "=1.0.228"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt", "net", "io-util", "sync", "time"] }
futures-util = "=0.3.34"
broker-cluster = { path = "../../../crates/cluster" }
deadpool-postgres = "=0.14.1"
tokio-postgres = "=0.7.15"
