[workspace]
members = ["crates/extension", "crates/gateway", "crates/protocol"]
default-members = ["crates/gateway", "crates/protocol"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/justusepostgres/pg_broker"
[workspace.dependencies]
serde_json = "=1.0.154"
anyhow = "=1.0.104"
[profile.dev]
panic = "unwind"
[profile.release]
panic = "unwind"
